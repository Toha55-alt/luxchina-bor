<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STEAMUL — Олимпиада</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#16203a;--mute:#6b7893;--line:#e0e5f0;--p:#4f46e5;--p2:#06b6d4;--ok:#16a34a;--bad:#dc2626;--soft:#eef0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1120;--card:#151c33;--ink:#eaf0ff;--mute:#93a0bd;--line:#26304d;--soft:#1e2748}}
:root[data-theme="dark"]{--bg:#0c1120;--card:#151c33;--ink:#eaf0ff;--mute:#93a0bd;--line:#26304d;--soft:#1e2748}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
body{min-height:100%}
.top{background:linear-gradient(120deg,var(--p),var(--p2));color:#fff;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{font-size:1.4rem;font-weight:800;letter-spacing:.08em}.brand small{display:block;font-size:.65rem;font-weight:400;letter-spacing:.12em;opacity:.9}
.chip{background:rgba(255,255,255,.2);border-radius:20px;padding:5px 12px;font-size:.85rem;display:flex;gap:8px;align-items:center}
.chip button{background:none;border:0;color:#fff;cursor:pointer;text-decoration:underline;font:inherit}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;font:inherit;font-size:.9rem}
nav button.on{background:var(--p);color:#fff;border-color:var(--p)}
main{max-width:980px;margin:0 auto;padding:6px 12px 30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
h2{margin:4px 0 10px;font-size:1.15rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--p);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.g{background:var(--soft);color:var(--ink)}.btn.r{background:var(--bad)}.btn.s{padding:6px 10px;font-size:.8rem}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.grow{flex:1;min-width:0}.mute{color:var(--mute);font-size:.82rem}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.badge{font-size:.72rem;padding:3px 9px;border-radius:12px;background:var(--soft)}.badge.ok{background:var(--ok);color:#fff}
.login{max-width:360px;margin:40px auto}.login .in{margin-bottom:10px}.err{color:var(--bad);font-size:.88rem;margin-bottom:8px}
.pod{display:flex;gap:8px;align-items:flex-end;justify-content:center;margin:10px 0 16px}
